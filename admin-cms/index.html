<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Pressing Pro Admin - Tableau de bord de supervision et gestion tarifaire du pressing." />
    <title>Pressing Pro - Admin CMS</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%); gap: 1.5rem; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 12px;">
          <img src="/favicon.png" alt="Pressing Pro" style="width: 72px; height: 72px; border-radius: 18px; box-shadow: 0 12px 28px rgba(0,0,0,0.4);" />
          <div style="display: flex; align-items: center; gap: 8px;">
            <span style="font-size: 1.7rem; font-weight: 900; color: #ffffff; letter-spacing: -0.5px;">PRESSING</span>
            <span style="font-size: 1.7rem; font-weight: 900; color: #38bdf8; letter-spacing: -0.5px;">PRO</span>
          </div>
          <span style="font-size: 0.72rem; font-weight: 700; color: rgba(255,255,255,0.45); letter-spacing: 2px; text-transform: uppercase;">ADMINISTRATION &amp; CAISSE</span>
        </div>
        <div style="width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid #38bdf8; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
        <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
