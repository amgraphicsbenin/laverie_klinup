<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Pressing Pro Admin - Tableau de bord de supervision et gestion tarifaire du pressing." />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  </head>
  <body>
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 15%, #ffffff 0%, #f0f7ff 35%, #dbeafe 70%, #93c5fd 100%); padding: 2rem 1.5rem; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
        <div style="width: 100%; max-width: 420px; background: #ffffff; border-radius: 30px; box-shadow: 0 25px 80px -15px rgba(37, 99, 235, 0.16); padding: 3.2rem 2.5rem; display: flex; flex-direction: column; align-items: center; text-align: center; box-sizing: border-box;">
          <img src="/favicon.png" alt="Pressing Pro" style="width: 64px; height: 64px; object-fit: contain; filter: brightness(0); margin-bottom: 1.25rem;" />
          <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 4px;">
            <span style="font-size: 1.65rem; font-weight: 700; color: #0f172a; letter-spacing: -0.5px;">PRESSING</span>
            <span style="font-size: 1.65rem; font-weight: 700; color: #2563eb; letter-spacing: -0.5px;">PRO</span>
          </div>
          <span style="font-size: 0.72rem; font-weight: 600; color: #64748b; letter-spacing: 2.5px; text-transform: uppercase; margin-bottom: 2.2rem;">ADMINISTRATION &amp; CAISSE</span>
          <div style="width: 42px; height: 42px; border: 3.5px solid rgba(37, 99, 235, 0.12); border-top: 3.5px solid #2563eb; border-radius: 50%; animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;"></div>
          <p style="color: #64748b; font-size: 0.88rem; font-weight: 500; margin: 1rem 0 0 0;">Connexion au serveur en cours…</p>
        </div>
        <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
