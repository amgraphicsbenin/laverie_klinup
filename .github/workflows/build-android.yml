name: Build Native Android APK (Kotlin & Jetpack Compose)

on:
  push:
    branches:
      - test
      - staging
      - production
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Environnement cible du build'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - staging
          - production
      build_type:
        description: 'Type de build'
        required: false
        default: 'release'
        type: choice
        options:
          - release

jobs:
  build:
    name: Build Android Native APK (${{ github.ref_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Resolve Target Environment
        id: resolve-env
        env:
          FIREBASE_APP_ID_SECRET: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_APP_ID_STAGING_SECRET: ${{ secrets.FIREBASE_APP_ID_STAGING }}
          FIREBASE_APP_ID_PROD_SECRET: ${{ secrets.FIREBASE_APP_ID_PROD }}
          FIREBASE_SERVICE_ACCOUNT_SECRET: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET_ENV="${{ github.event.inputs.target_env }}"
          elif [ "${{ github.ref_name }}" = "test" ]; then
            TARGET_ENV="test"
          elif [ "${{ github.ref_name }}" = "staging" ]; then
            TARGET_ENV="staging"
          else
            TARGET_ENV="production"
          fi
          
          echo "APP_ENV=${TARGET_ENV}" >> $GITHUB_ENV
          echo "TARGET_ENV=${TARGET_ENV}" >> $GITHUB_OUTPUT
          echo "🎯 Environnement sélectionné : ${TARGET_ENV}"

          if [ "${TARGET_ENV}" = "production" ]; then
            TARGET_FIREBASE_APP_ID="${FIREBASE_APP_ID_PROD_SECRET:-1:735467305399:android:43c1e315d66b4c56069032}"
          elif [ "${TARGET_ENV}" = "staging" ] && [ -n "${FIREBASE_APP_ID_STAGING_SECRET}" ]; then
            TARGET_FIREBASE_APP_ID="${FIREBASE_APP_ID_STAGING_SECRET}"
          elif [ -n "${FIREBASE_APP_ID_SECRET}" ]; then
            TARGET_FIREBASE_APP_ID="${FIREBASE_APP_ID_SECRET}"
          else
            TARGET_FIREBASE_APP_ID="1:735467305399:android:170a40fff0cb9af8069032"
          fi

          if [ -n "${TARGET_FIREBASE_APP_ID}" ] && [ -n "${FIREBASE_SERVICE_ACCOUNT_SECRET}" ]; then
            echo "HAS_FIREBASE=true" >> $GITHUB_ENV
            echo "FIREBASE_APP_ID=${TARGET_FIREBASE_APP_ID}" >> $GITHUB_ENV
            echo "📱 Firebase App Distribution configuré pour ${TARGET_ENV}"
          else
            echo "HAS_FIREBASE=false" >> $GITHUB_ENV
            echo "ℹ️ Firebase App Distribution non configuré pour ${TARGET_ENV} (étape ignorée)"
          fi

      - name: Configure Versioning & Environment
        run: |
          VERSION_NAME="1.0.0"
          BUILD_NUMBER=${{ github.run_number }}
          ENV_LABEL="${{ env.APP_ENV }}"
          APK_FILE_NAME="klinup-${ENV_LABEL}-v${VERSION_NAME}-b${BUILD_NUMBER}.apk"
          COMMIT_NOTES=$(git log -n 5 --pretty=format:"• %s (%h)")
          
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          echo "BUILD_NUMBER=${BUILD_NUMBER}" >> $GITHUB_ENV
          echo "APK_NAME=${APK_FILE_NAME}" >> $GITHUB_ENV
          {
            echo "COMMIT_NOTES<<EOF"
            echo "${COMMIT_NOTES}"
            echo "EOF"
          } >> $GITHUB_ENV
          
          echo "🏗️ Building KLIN UP [${ENV_LABEL}] v${VERSION_NAME} (Build #${BUILD_NUMBER})"
          echo "📝 Commits récents :"
          echo "${COMMIT_NOTES}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android-app/gradle/wrapper/gradle-wrapper.properties', 'android-app/build.gradle.kts', 'android-app/app/build.gradle.kts') }}
          restore-keys: |
            gradle-

      - name: Make Gradle wrapper executable
        run: chmod +x android-app/gradlew

      - name: Configure Release Signing Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > android-app/app/release.keystore
            echo "ANDROID_KEYSTORE_PATH=${GITHUB_WORKSPACE}/android-app/app/release.keystore" >> $GITHUB_ENV
            echo "ANDROID_KEYSTORE_PASSWORD=${ANDROID_KEYSTORE_PASSWORD}" >> $GITHUB_ENV
            echo "ANDROID_KEY_ALIAS=${ANDROID_KEY_ALIAS}" >> $GITHUB_ENV
            echo "ANDROID_KEY_PASSWORD=${ANDROID_KEY_PASSWORD}" >> $GITHUB_ENV
            echo "🔐 Keystore de signature release configuré depuis les secrets GitHub."
          else
            echo "🔑 Utilisation de la clé persistante klinup-debug.keystore (signature stable entre builds)."
          fi

      - name: Build Release APK
        working-directory: android-app
        run: ./gradlew assembleRelease --no-daemon --build-cache --parallel -x lint -x test

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: android-app/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Distribute APK to Firebase App Tester
        if: ${{ env.HAS_FIREBASE == 'true' }}
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ env.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          file: android-app/app/build/outputs/apk/release/app-release.apk
          releaseNotes: |
            🚀 KLIN UP (${{ env.APP_ENV }}) - v${{ env.VERSION_NAME }} (Build #${{ env.BUILD_NUMBER }})
            Branche : ${{ github.ref_name }}

            Modifications incluses :
            ${{ env.COMMIT_NOTES }}

      - name: Publish In-App OTA Update Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ota-${{ env.APP_ENV }}"
          APK_PATH="android-app/app/build/outputs/apk/release/app-release.apk"
          export APK_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/app-release.apk"

          node -e '
            const fs = require("fs");
            const manifest = {
              versionCode: Number(process.env.BUILD_NUMBER),
              versionName: process.env.VERSION_NAME,
              apkUrl: process.env.APK_URL,
              releaseNotes: process.env.COMMIT_NOTES || "",
              mandatory: false
            };
            fs.writeFileSync("latest.json", JSON.stringify(manifest, null, 2));
          '

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" \
              --title "Pressing Pro (${{ env.APP_ENV }}) v${{ env.VERSION_NAME }} (#${{ env.BUILD_NUMBER }})" \
              --notes "${COMMIT_NOTES}"
            gh release upload "${TAG}" "${APK_PATH}" latest.json --clobber
          else
            gh release create "${TAG}" "${APK_PATH}" latest.json \
              --title "Pressing Pro (${{ env.APP_ENV }}) v${{ env.VERSION_NAME }} (#${{ env.BUILD_NUMBER }})" \
              --notes "${COMMIT_NOTES}" \
              --prerelease
          fi
